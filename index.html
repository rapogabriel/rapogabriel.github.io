<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal - Gabriel Raposo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="terminal">
        <div id="output-container">
            <div class="output">Bem-vindo ao terminal web interativo. Digite <span class="highlight">'help'</span> para ver os comandos disponíveis.</div>
        </div>
        
        <!-- Linha de comando atual -->
        <div class="command-line">
            <span class="prompt-user">gabriel@pop-os</span><span class="prompt-separator">:</span><span class="prompt-path">~</span>$ 
            <input type="text" id="command-input" autocomplete="off" spellcheck="false" autofocus>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
